[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditlm"
version = "0.1.2"
description = "Open source evaluation toolkit for LLM pipelines and agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Nabi", email = "mdehtashamnabi5981@gmail.com"}
]

keywords = ["llm", "evaluation", "hallucination", "agents", "observability"]

dependencies = [
    "streamlit>=1.32.0",
    "openai>=1.0.0",
    "google-generativeai>=0.5.0",
    "pandas>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
auditlm = "agentaudit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentaudit*"]

[project.urls]
Homepage = "https://github.com/me-nabi/AiAudit.git"
"Bug Tracker" = "https://github.com/me-nabi/AiAudit/issues"